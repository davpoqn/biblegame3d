<!doctype html>
<!-- 사이트 아이콘(펼친 책과 빛나는 십자가)을 three.js로 그린다. tools/icon/render.py가 열어서 PNG로 저장한다 -->
<html><head><meta charset="utf-8">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head><body style="margin:0">
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const S = 1024;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(S, S); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const envTex = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;

function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
// 가죽 결(무작위라 그릴 때마다 아주 조금 다르다)
const grain = canvasTex(256, 256, (g, w, h) => { const d = g.createImageData(w, h); for (let i = 0; i < d.data.length; i += 4) { const v = 110 + Math.random() * 90; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); });
grain.colorSpace = THREE.NoColorSpace; grain.wrapS = grain.wrapT = THREE.RepeatWrapping; grain.repeat.set(3, 3);
const pageEdge = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#efe4cc'; g.fillRect(0, 0, w, h); for (let i = 0; i < 256; i += 3) { g.fillStyle = `rgba(120,95,60,${.18 + Math.random() * .2})`; g.fillRect(0, i, w, 1); } });

function crossShape(H, W, t, bar) { // 라틴 십자가: 세로 H, 가로 W, 굵기 t, 가로대 높이(위에서) bar
  const s = new THREE.Shape(), x = t / 2, top = H / 2, yb = top - bar;
  s.moveTo(-x, -top); s.lineTo(x, -top); s.lineTo(x, yb - x); s.lineTo(W / 2, yb - x); s.lineTo(W / 2, yb + x); s.lineTo(x, yb + x);
  s.lineTo(x, top); s.lineTo(-x, top); s.lineTo(-x, yb + x); s.lineTo(-W / 2, yb + x); s.lineTo(-W / 2, yb - x); s.lineTo(-x, yb - x); s.closePath();
  return s;
}
function cross3D(H, W, t, depth, bev, mat) {
  const g = new THREE.ExtrudeGeometry(crossShape(H, W, t, H * .3), { depth, bevelEnabled: true, bevelThickness: bev, bevelSize: bev * .8, bevelSegments: 4, curveSegments: 4 });
  g.translate(0, 0, -depth / 2); return new THREE.Mesh(g, mat);
}
// 펼친 책: 바닥에 놓여 위로 펼쳐짐(+y가 위). 책장에는 글자 대신 옅은 줄만 긋는다
function openBook({ w = .92, h = 1.25, color = '#4a2718' } = {}) {
  const b = new THREE.Group();
  const cover = new THREE.Mesh(new RoundedBoxGeometry(2 * w + .12, .05, h + .1, 4, .02), new THREE.MeshStandardMaterial({ color, roughness: .58, bumpMap: grain, bumpScale: .9 }));
  cover.position.y = -.03; b.add(cover);
  const pm = new THREE.MeshStandardMaterial({ color: '#f1e7d0', roughness: .85, side: THREE.DoubleSide });
  const edge = new THREE.MeshStandardMaterial({ map: pageEdge, roughness: .8 });
  const prof = u => .1 + .13 * Math.sqrt(u) * (1 - .55 * u); // 가운데(0)에서 솟았다가 가장자리로 내려감
  for (const s of [1, -1]) {
    const g = new THREE.PlaneGeometry(w, h, 40, 1); g.rotateX(-Math.PI / 2);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) { const u = Math.min(1, Math.max(0, (p.getX(i) + w / 2) / w)); p.setX(i, s * u * w); p.setY(i, prof(u) - .08 * (1 - Math.min(1, u * 8))); }
    g.computeVertexNormals(); b.add(new THREE.Mesh(g, pm));
    const e = new THREE.Mesh(new THREE.BoxGeometry(.012, .1, h), edge); e.position.set(s * (w + .002), prof(1) - .05, 0); b.add(e);
    for (let k = 0; k < 7; k++) { const ln = new THREE.Mesh(new THREE.PlaneGeometry(w * .62, .012), new THREE.MeshBasicMaterial({ color: '#cbbb9a' })); ln.rotation.x = -Math.PI / 2; ln.position.set(s * .52 * w, prof(.52) + .004, -h * .32 + k * h * .1); b.add(ln); }
  }
  return b;
}

const sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1, .1, 50);
cam.position.set(0, 2.7, 3.35); cam.lookAt(0, .3, 0);
const bk = openBook(); bk.position.y = -.25; sc.add(bk);
const cr = cross3D(.95, .62, .13, .1, .02, new THREE.MeshStandardMaterial({ color: '#f0bb5c', emissive: '#ff9d2e', emissiveIntensity: .32, metalness: .7, roughness: .34, envMapIntensity: .9 }));
cr.position.set(0, .78, .05); cr.rotation.x = -.5; sc.add(cr);
const key = new THREE.DirectionalLight('#ffe2b8', 1.6); key.position.set(1, 4, 3); sc.add(key);
const glow = new THREE.PointLight('#ffb050', 3, 4, 1.5); glow.position.set(0, .7, .3); sc.add(glow);
sc.environment = envTex; renderer.setClearColor(0, 0); renderer.render(sc, cam);
const art = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = renderer.domElement.toDataURL('image/png'); });

// 바탕: 밤하늘에서 검은 땅으로, 십자가 둘레에 숯불빛. (cx, cy)가 빛의 중심, R이 반지름
function night(g, W, H, cx, cy, R) {
  const lg = g.createLinearGradient(0, 0, 0, H); lg.addColorStop(0, '#141826'); lg.addColorStop(1, '#0c0a09'); g.fillStyle = lg; g.fillRect(0, 0, W, H);
  const rg = g.createRadialGradient(cx, cy, 0, cx, cy, R); rg.addColorStop(0, 'rgba(255,190,110,.55)'); rg.addColorStop(1, 'rgba(255,150,70,0)'); g.fillStyle = rg; g.fillRect(0, 0, W, H);
}
function make(W, H, draw) { const c = document.createElement('canvas'); c.width = W; c.height = H; draw(c.getContext('2d')); return c.toDataURL('image/png'); }
window.ICONS = {
  // 둥근 모서리: 브라우저 탭, 안드로이드 홈 화면
  round: make(S, S, g => { g.beginPath(); g.roundRect(0, 0, S, S, S * .225); g.clip(); night(g, S, S, S / 2, S * .36, S * .5); g.drawImage(art, 0, 0); }),
  // 네모: 아이폰 홈 화면(아이폰이 모서리를 직접 둥글린다)
  square: make(S, S, g => { night(g, S, S, S / 2, S * .36, S * .5); g.drawImage(art, 0, 0); }),
  // 공유 미리보기(카카오톡 등) 1200×630. 제목 글자는 넣지 않는다(페이지 제목이 따로 붙는다)
  og: make(1200, 630, g => { night(g, 1200, 630, 600, 630 * .36, 520); g.drawImage(art, 600 - 315, 0, 630, 630); }),
};
</script>
</body></html>
