<!doctype html>
<!-- 사이트 아이콘: 인트로의 닫힌 성경책(갈색 가죽, 금박 십자가, 금빛 책장 가장자리, 비스듬히 뜬 모습)을 three.js로 그린다.
     재료와 자세는 src/index.html intro()의 책과 같다(닫힌 상태 e = 0). 작은 아이콘에서도 보이게 십자가만 조금 크게.
     tools/icon/render.py가 열어서 PNG로 저장한다 (2026-10-15 사용자 요청) -->
<html><head><meta charset="utf-8">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head><body style="margin:0">
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const S = 1024, CROSS = 1.3;  // CROSS: 인트로보다 십자가를 이만큼 크게
const R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
R.setSize(S, S); R.setPixelRatio(1); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1; R.setClearColor(0, 0);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1, .1, 60);
const pm = new THREE.PMREMGenerator(R); scene.environment = pm.fromScene(new RoomEnvironment(R), .04).texture; pm.dispose();
scene.add(new THREE.HemisphereLight(0xfff6e8, 0xcdb894, .6));
const key = new THREE.DirectionalLight(0xfff1da, 1.9); key.position.set(-2.5, 6, 4); scene.add(key);
const tex = (w, h, draw, color = true) => {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (color) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = R.capabilities.getMaxAnisotropy(); return t;
};
const radial = stops => tex(128, 128, g => { const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); stops.forEach(([o, c]) => r.addColorStop(o, c)); g.fillStyle = r; g.fillRect(0, 0, 128, 128); });

// 표지 (인트로와 같다. 십자가만 CROSS배)
const cross = (g, w, h) => {
  const cx = w / 2, cy = h * .46, b = w * .085 * CROSS, vh = Math.min(h * .46 * CROSS, h * .7), hw = Math.min(w * .44 * CROSS, w * .74), hy = cy - vh * .2, cap = b * .45;
  g.beginPath(); g.rect(cx - b / 2, cy - vh / 2, b, vh); g.rect(cx - hw / 2, hy - b / 2, hw, b);
  g.rect(cx - b * .8, cy - vh / 2, b * 1.6, cap); g.rect(cx - b * .8, cy + vh / 2 - cap, b * 1.6, cap);
  g.rect(cx - hw / 2, hy - b * .8, cap, b * 1.6); g.rect(cx + hw / 2 - cap, hy - b * .8, cap, b * 1.6);
};
const leather = withCross => tex(512, 708, (g, w, h) => {
  g.fillStyle = '#3b2416'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '20,10,4' : '130,90,58'},${(.35 * Math.random()).toFixed(2)})`; g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 3, 1 + Math.random() * 3); }
  const v = g.createRadialGradient(w / 2, h / 2, w * .25, w / 2, h / 2, h * .75); v.addColorStop(0, 'rgba(90,60,38,0)'); v.addColorStop(1, 'rgba(14,7,3,.55)'); g.fillStyle = v; g.fillRect(0, 0, w, h);
  g.setLineDash([9, 6]); g.strokeStyle = 'rgba(196,150,98,.45)'; g.lineWidth = 2.5; g.strokeRect(20, 20, w - 40, h - 40); g.setLineDash([]);
  g.strokeStyle = 'rgba(12,6,2,.5)'; g.lineWidth = 3; g.strokeRect(30, 30, w - 60, h - 60);
  if (!withCross) return;
  g.save(); g.translate(3, 4); cross(g, w, h); g.fillStyle = 'rgba(15,8,3,.6)'; g.fill(); g.restore();
  const gd = g.createLinearGradient(0, h * .2, w, h * .7); gd.addColorStop(0, '#fbe7a6'); gd.addColorStop(.45, '#d9ad55'); gd.addColorStop(1, '#9c7029');
  cross(g, w, h); g.fillStyle = gd; g.fill();
});
const rough = withCross => tex(512, 708, (g, w, h) => { g.fillStyle = 'rgb(0,200,0)'; g.fillRect(0, 0, w, h); if (withCross) { cross(g, w, h); g.fillStyle = 'rgb(0,80,255)'; g.fill(); } }, false);  // G: 거칠기, B: 금속
const bump = withCross => tex(512, 708, (g, w, h) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 12000; i++) { const l = 100 + Math.random() * 60 | 0; g.fillStyle = `rgb(${l},${l},${l})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  if (withCross) { cross(g, w, h); g.fillStyle = '#fff'; g.fill(); }
}, false);
const coverMat = withCross => { const mr = rough(withCross); return new THREE.MeshStandardMaterial({ map: leather(withCross), roughnessMap: mr, metalnessMap: mr, bumpMap: bump(withCross), bumpScale: 2, roughness: 1, metalness: 1 }); };
const outFront = coverMat(true), outBack = coverMat(false);
const hide = new THREE.MeshStandardMaterial({ color: 0x3b2516, roughness: .8 });
const spine = new THREE.MeshStandardMaterial({ color: 0x45291a, roughness: .75, bumpMap: outBack.bumpMap, bumpScale: 2 });
const gold = new THREE.MeshStandardMaterial({ metalness: .85, roughness: .3, map: tex(8, 256, (g, w, h) => { for (let y = 0; y < h; y++) { const l = 170 + Math.random() * 70; g.fillStyle = `rgb(${l | 0},${l * .76 | 0},${l * .4 | 0})`; g.fillRect(0, y, w, 1); } }) });
const paper = new THREE.MeshStandardMaterial({ color: 0xd9cbad, roughness: .9 });

// 닫힌 책: 인트로와 같은 크기·자세 (root 기울기 .62, -.5, .16)
const W = 1.3, D = 1.8, T = .2, C = .035, H = T + C, PW = W - .037, PD = D - .07, PX = .002 + PW / 2, BS = 1.3;
const root = new THREE.Group(), book = new THREE.Group(); scene.add(root); root.add(book); book.scale.setScalar(BS);
const slab = (sx, sy, sz, x, y, mats) => { const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mats); m.position.set(x, y, 0); book.add(m); return m; };
slab(PW, 2 * T, PD, PX, H, [gold, paper, paper, paper, gold, gold]);           // 책장 (가장자리 금빛)
slab(W, C, D, W / 2, C / 2, [hide, hide, hide, outBack, hide, hide]);           // 뒤표지
slab(W, C, D, W / 2, 2 * H - C / 2, [hide, hide, outFront, hide, hide, hide]);  // 앞표지 (금박 십자가)
slab(C, 2 * H, D, -C / 2, H, spine);                                            // 등
book.position.set(-W / 2 * BS, -H * BS, 0);
root.rotation.set(.62, -.5, .16, 'YXZ'); root.position.y = .05;
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: radial([[0, 'rgba(60,40,20,.5)'], [.5, 'rgba(60,40,20,.2)'], [1, 'rgba(60,40,20,0)']]), transparent: true, depthWrite: false, toneMapped: false }));
shadow.rotation.x = -Math.PI / 2; shadow.position.y = -.85; shadow.scale.set(3.4, 2.2, 1); scene.add(shadow);

// 책이 화면을 채우게 카메라를 맞춘다 (인트로처럼 위에서 비스듬히 내려다본다)
scene.updateMatrixWorld();
const box = new THREE.Box3().setFromObject(book), ctr = box.getCenter(new THREE.Vector3()), rad = box.getSize(new THREE.Vector3()).length() / 2;
const d = rad / Math.sin(THREE.MathUtils.degToRad(15)) * .86;
cam.position.set(ctr.x, ctr.y + d * .447, ctr.z + d * .894); cam.lookAt(ctr);
R.render(scene, cam);
const art = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = R.domElement.toDataURL('image/png'); });

// 바탕: 인트로처럼 따뜻한 흰색, 책 뒤로 은은한 금빛
function warm(g, W, H, cx, cy, Rr) {
  const lg = g.createLinearGradient(0, 0, 0, H); lg.addColorStop(0, '#fbf6ec'); lg.addColorStop(1, '#efe3cc'); g.fillStyle = lg; g.fillRect(0, 0, W, H);
  const rg = g.createRadialGradient(cx, cy, 0, cx, cy, Rr); rg.addColorStop(0, 'rgba(255,214,140,.55)'); rg.addColorStop(1, 'rgba(255,214,140,0)'); g.fillStyle = rg; g.fillRect(0, 0, W, H);
}
function make(W, H, draw) { const c = document.createElement('canvas'); c.width = W; c.height = H; draw(c.getContext('2d')); return c.toDataURL('image/png'); }
window.ICONS = {
  // 둥근 모서리: 브라우저 탭, 안드로이드 홈 화면
  round: make(S, S, g => { g.beginPath(); g.roundRect(0, 0, S, S, S * .225); g.clip(); warm(g, S, S, S / 2, S * .45, S * .55); g.drawImage(art, 0, 0); }),
  // 네모: 아이폰 홈 화면(아이폰이 모서리를 직접 둥글린다)
  square: make(S, S, g => { warm(g, S, S, S / 2, S * .45, S * .55); g.drawImage(art, 0, 0); }),
  // 공유 미리보기(카카오톡 등) 1200×630. 제목 글자는 넣지 않는다(페이지 제목이 따로 붙는다)
  og: make(1200, 630, g => { warm(g, 1200, 630, 600, 630 * .45, 520); g.drawImage(art, 600 - 315, 0, 630, 630); }),
};
</script>
</body></html>
